  root __INSTALL_DIR__/public;
  
  #sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
  location __PATH__/ {
    ## Serve static files from defined root folder.
    ## @huginn is a named location for the upstream fallback, see below.
    try_files $uri $uri/index.html $uri.html @huginn;
  }

  ## If a file, which is not found in the root folder is requested,
  ## then the proxy passes the request to the upstream Puma app.
  location @huginn {
    ## If you use HTTPS make sure you disable gzip compression
    ## to be safe against BREACH attack.
    gzip off;

    proxy_read_timeout      300;
    proxy_connect_timeout   300;
    proxy_redirect          off;

    include proxy_params_no_auth;
    proxy_set_header    X-Frame-Options     SAMEORIGIN;

    proxy_pass http://unix:/__INSTALL_DIR__/tmp/sockets/puma.sock;
  }